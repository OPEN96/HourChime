name: 功能建议
description: 提出新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述使用场景，而不只是想要的按钮
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议的做法
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 这个功能不依赖联网 / 账号 / 云端服务（本项目坚持纯本地运行）
          required: false
